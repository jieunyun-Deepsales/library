<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>딥세일즈 도서 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.09);
    --border-md: rgba(0,0,0,0.15);
    --text: #1a1a1a;
    --text-sub: #6b6b6b;
    --text-hint: #9e9e9e;
    --radius: 10px;
    --radius-sm: 6px;
    --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --amber-bg: #FAEEDA; --amber-text: #633806;
    --green-bg: #EAF3DE; --green-text: #27500A;
    --red-bg: #FCEBEB; --red-text: #791F1F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }

  /* Header */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .logo span { color: var(--blue-text); }

  /* Tabs */
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; }
  .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 0; }
  .tab-btn { padding: 13px 18px; font-size: 14px; font-weight: 500; color: var(--text-sub); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .tab-btn svg { width: 16px; height: 16px; }

  /* Main */
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 1.25rem; }

  /* Metrics */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.25rem; }
  .met { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-align: center; }
  .met-v { font-size: 28px; font-weight: 600; }
  .met-l { font-size: 12px; color: var(--text-sub); margin-top: 3px; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-grid.full { grid-template-columns: 1fr; }
  .field label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 5px; font-weight: 500; }
  input[type=text], input[type=url], select {
    width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border-md); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }

  /* Buttons */
  .btn { padding: 9px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; border: 1px solid var(--border-md); background: var(--surface); color: var(--text); }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn.primary:hover { background: #333; }
  .btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn-row { display: flex; justify-content: flex-end; margin-top: 6px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .b-blue   { background: var(--blue-bg);  color: var(--blue-text); }
  .b-amber  { background: var(--amber-bg); color: var(--amber-text); }
  .b-green  { background: var(--green-bg); color: var(--green-text); }
  .b-red    { background: var(--red-bg);   color: var(--red-text); }

  /* Alerts */
  .alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px; display: none; align-items: center; gap: 8px; }
  .alert.show { display: flex; }
  .alert.warn    { background: var(--amber-bg); color: var(--amber-text); border: 1px solid #FAC775; }
  .alert.success { background: var(--green-bg); color: var(--green-text); border: 1px solid #C0DD97; }
  .alert.danger  { background: var(--red-bg);   color: var(--red-text);   border: 1px solid #F09595; }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; font-size: 11px; color: var(--text-sub); padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg); letter-spacing: 0.3px; text-transform: uppercase; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .overdue-row td { background: #fff8f8 !important; }

  .sub-text { font-size: 11px; color: var(--text-hint); margin-top: 1px; }
  .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
  .section-lbl { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }
  .empty-state { text-align: center; padding: 3rem; color: var(--text-hint); font-size: 13px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }

  @media (max-width: 640px) {
    main { padding: 1rem; }
    .form-grid { grid-template-columns: 1fr; }
    .metrics { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .met-v { font-size: 22px; }
    nav { overflow-x: auto; }
    .tab-btn { white-space: nowrap; padding: 13px 14px; font-size: 13px; }
    table { font-size: 12px; }
    th, td { padding: 8px 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Deepsales <span>도서관</span></div>
    <div style="font-size:12px;color:var(--text-hint)" id="last-updated"></div>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <button class="tab-btn active" onclick="showTab('request',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      신규 도서 신청
    </button>
    <button class="tab-btn" onclick="showTab('admin',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
      구매 신청 관리
    </button>
    <button class="tab-btn" onclick="showTab('books',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      도서 목록
    </button>
    <button class="tab-btn" onclick="showTab('rental',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
      대여 / 반납
    </button>
  </div>
</nav>

<main>

  <!-- 신규 도서 신청 -->
  <div class="panel active" id="panel-request">
    <div class="card">
      <div class="card-title">도서 구매 신청</div>
      <div id="dup-alert" class="alert warn">⚠️ 이미 신청 또는 보유 중인 도서입니다.</div>
      <div id="req-ok"    class="alert success">✓ 신청이 완료되었습니다.</div>
      <div id="req-err"   class="alert danger"><span id="req-err-msg"></span></div>
      <div class="form-grid full field">
        <label>도서명 *</label>
        <input id="req-title" type="text" placeholder="신청할 도서명을 입력하세요" oninput="checkDup()">
      </div>
      <div class="form-grid full field">
        <label>구매 링크</label>
        <input id="req-link" type="url" placeholder="https://...">
      </div>
      <div class="form-grid">
        <div class="field"><label>신청자 *</label><input id="req-name" type="text" placeholder="이름"></div>
        <div class="field"><label>소속 팀</label>
          <select id="req-team"><option value="">팀 선택</option><option>개발팀</option><option>영업팀</option><option>기획팀</option><option>제품팀</option><option>디자인팀</option><option>QA팀</option></select>
        </div>
      </div>
      <div class="btn-row"><button class="btn primary" id="req-btn" onclick="submitRequest()">신청하기</button></div>
    </div>
  </div>

  <!-- 구매 신청 관리 -->
  <div class="panel" id="panel-admin">
    <div class="metrics">
      <div class="met"><div class="met-v" id="cnt-pending" style="color:var(--blue-text)">—</div><div class="met-l">구매 신청</div></div>
      <div class="met"><div class="met-v" id="cnt-purchased" style="color:var(--amber-text)">—</div><div class="met-l">구매 완료</div></div>
      <div class="met"><div class="met-v" id="cnt-arrived" style="color:var(--green-text)">—</div><div class="met-l">도착 완료</div></div>
    </div>
    <div id="admin-err" class="alert danger"><span id="admin-err-msg"></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>도서명</th><th>신청자</th><th>신청일</th><th>상태</th><th>구매일</th><th>도착일</th><th>링크</th><th>액션</th>
        </tr></thead>
        <tbody id="admin-tbody"><tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-hint)"><span class="spin">↻</span> 불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 도서 목록 -->
  <div class="panel" id="panel-books">
    <div class="metrics">
      <div class="met"><div class="met-v" id="cnt-total">—</div><div class="met-l">전체 도서</div></div>
      <div class="met"><div class="met-v" id="cnt-avail" style="color:var(--green-text)">—</div><div class="met-l">대여 가능</div></div>
      <div class="met"><div class="met-v" id="cnt-out" style="color:var(--amber-text)">—</div><div class="met-l">대여 중</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>도서명</th><th>분류</th><th>등록일</th><th>상태</th><th>대여자</th></tr></thead>
        <tbody id="books-tbody"><tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-hint)"><span class="spin">↻</span> 불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 대여/반납 -->
  <div class="panel" id="panel-rental">
    <div class="card">
      <div class="card-title">대여 신청</div>
      <div id="rent-ok"  class="alert success"><span id="rent-ok-msg"></span></div>
      <div id="rent-err" class="alert danger"><span id="rent-err-msg"></span></div>
      <div class="form-grid">
        <div class="field"><label>도서 선택 *</label><select id="rent-book"><option value="">불러오는 중...</option></select></div>
        <div class="field"><label>이름 *</label><input id="rent-person" type="text" placeholder="본인 이름"></div>
      </div>
      <div class="form-grid full field">
        <label>소속 팀</label>
        <select id="rent-team"><option value="">팀 선택</option><option>개발팀</option><option>영업팀</option><option>기획팀</option><option>제품팀</option><option>디자인팀</option><option>QA팀</option></select>
      </div>
      <div class="btn-row"><button class="btn primary" id="rent-btn" onclick="doRent()">대여 신청</button></div>
    </div>

    <div class="divider"></div>

    <div class="card">
      <div class="card-title">반납 신청</div>
      <div id="return-ok"  class="alert success">✓ 반납이 완료되었습니다.</div>
      <div id="return-err" class="alert danger"><span id="return-err-msg"></span></div>
      <div class="form-grid">
        <div class="field"><label>이름 *</label><input id="return-person" type="text" placeholder="본인 이름" oninput="filterMyRentals()"></div>
        <div class="field"><label>반납할 도서 *</label><select id="return-book"><option value="">이름을 먼저 입력하세요</option></select></div>
      </div>
      <div class="btn-row"><button class="btn primary" id="return-btn" onclick="doReturn()">반납 신청</button></div>
    </div>

    <div class="divider"></div>

    <div class="section-lbl">전체 대여 현황</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>도서명</th><th>대여자</th><th>팀</th><th>대여일</th><th>경과일</th><th>상태</th></tr></thead>
        <tbody id="rental-tbody"><tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-hint)"><span class="spin">↻</span> 불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const API = 'https://script.google.com/a/macros/deepsales.com/s/AKfycbxbYoCd15IQKZKvKSSOZjwdmHLkFShBN5nlSo_4yxmsOLaKkZuS2Lh-Tr1NZVLaltr-WA/exec';
let cache = { requests: [], books: [], rentals: [] };

const today = () => new Date().toISOString().split('T')[0];
const fmt   = d => d ? String(d).replace(/-/g, '/') : '—';
const daysAgo = d => Math.floor((new Date() - new Date(d)) / 86400000);

async function apiFetch(params) {
  const res = await fetch(API + '?' + new URLSearchParams(params));
  return res.json();
}
async function apiPost(body) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

async function loadAll() {
  try {
    const data = await apiFetch({ action: 'getAll' });
    if (data.error) throw new Error(data.error);
    cache.requests = data.requests || [];
    cache.books    = data.books    || [];
    cache.rentals  = data.rentals  || [];
    const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('last-updated').textContent = `마지막 업데이트 ${now}`;
    renderAdmin(); renderBooks(); renderRental();
  } catch (e) {
    ['admin-tbody','books-tbody','rental-tbody'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = `<tr><td colspan="8" class="empty-state">⚠ 시트 연결 실패 — Apps Script 배포 상태를 확인하세요<br><small style="color:#bbb">${e.message}</small></td></tr>`;
    });
  }
}

function getRentedIds() {
  return new Set(cache.rentals.filter(r => String(r.returned) === 'false').map(r => Number(r.bookId)));
}

function showTab(t, el) {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + t).classList.add('active');
}

function checkDup() {
  const v = document.getElementById('req-title').value.trim().toLowerCase();
  const pool = [...cache.requests.map(r => r.title.toLowerCase()), ...cache.books.map(b => b.title.toLowerCase())];
  const a = document.getElementById('dup-alert');
  v.length > 1 && pool.some(d => d.includes(v) || v.includes(d))
    ? a.classList.add('show') : a.classList.remove('show');
}

async function submitRequest() {
  const title = document.getElementById('req-title').value.trim();
  const link  = document.getElementById('req-link').value.trim();
  const name  = document.getElementById('req-name').value.trim();
  const team  = document.getElementById('req-team').value;
  if (!title || !name) { (!title ? document.getElementById('req-title') : document.getElementById('req-name')).focus(); return; }
  const pool = [...cache.requests.map(r => r.title.toLowerCase()), ...cache.books.map(b => b.title.toLowerCase())];
  if (pool.some(d => d.includes(title.toLowerCase()) || title.toLowerCase().includes(d))) {
    document.getElementById('dup-alert').classList.add('show'); return;
  }
  const btn = document.getElementById('req-btn');
  btn.disabled = true; btn.textContent = '신청 중...';
  try {
    const res = await apiPost({ action: 'addRequest', data: { title, link, requester: name, team: team || '미기재', reqDate: today() } });
    if (!res.ok) throw new Error(res.error || '오류');
    cache.requests.push({ id: res.id, title, link, requester: name, team: team || '미기재', reqDate: today(), status: 'pending', purchaseDate: '', arrivalDate: '' });
    ['req-title','req-link','req-name'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('req-team').value = '';
    document.getElementById('dup-alert').classList.remove('show');
    const ok = document.getElementById('req-ok');
    ok.classList.add('show'); setTimeout(() => ok.classList.remove('show'), 3000);
  } catch (e) {
    document.getElementById('req-err-msg').textContent = e.message;
    const el = document.getElementById('req-err');
    el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 4000);
  } finally { btn.disabled = false; btn.textContent = '신청하기'; }
}

function renderAdmin() {
  const c = { pending: 0, purchased: 0, arrived: 0 };
  cache.requests.forEach(r => { if (c[r.status] !== undefined) c[r.status]++; });
  document.getElementById('cnt-pending').textContent   = c.pending;
  document.getElementById('cnt-purchased').textContent = c.purchased;
  document.getElementById('cnt-arrived').textContent   = c.arrived;
  document.getElementById('admin-tbody').innerHTML = cache.requests.length
    ? cache.requests.map(r => {
        const badge = r.status === 'pending'   ? '<span class="badge b-blue">구매 신청</span>'
                    : r.status === 'purchased' ? '<span class="badge b-amber">구매 완료</span>'
                    : '<span class="badge b-green">도착 완료</span>';
        const btn   = r.status === 'pending'   ? `<button class="btn sm" onclick="advance('${r.id}','purchased')">구매 처리</button>`
                    : r.status === 'purchased' ? `<button class="btn sm" onclick="advance('${r.id}','arrived')">도착 처리</button>` : '';
        const lnk   = r.link ? `<a href="${r.link}" target="_blank" style="color:var(--blue-text);font-size:12px">링크 ↗</a>` : '—';
        return `<tr>
          <td style="font-weight:500">${r.title}</td>
          <td>${r.requester}<div class="sub-text">${r.team}</div></td>
          <td>${fmt(r.reqDate)}</td><td>${badge}</td>
          <td>${fmt(r.purchaseDate)}</td><td>${fmt(r.arrivalDate)}</td>
          <td>${lnk}</td><td>${btn}</td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="8" class="empty-state">신청 내역이 없습니다</td></tr>';
}

async function advance(id, next) {
  const r = cache.requests.find(x => String(x.id) === String(id));
  if (!r) return;
  const d = today();
  try {
    const res = await apiPost({ action: 'updateRequestStatus', data: { id, status: next, date: d } });
    if (!res.ok) throw new Error(res.error || '오류');
    r.status = next;
    if (next === 'purchased') r.purchaseDate = d;
    if (next === 'arrived') {
      r.arrivalDate = d;
      const bookRes = await apiPost({ action: 'addBook', data: { title: r.title, category: '미분류', addedDate: d } });
      if (bookRes.ok) cache.books.push({ id: bookRes.id, title: r.title, category: '미분류', addedDate: d });
    }
    renderAdmin(); renderBooks(); renderRental();
  } catch (e) {
    document.getElementById('admin-err-msg').textContent = e.message;
    const el = document.getElementById('admin-err');
    el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 4000);
  }
}

function renderBooks() {
  const rented = getRentedIds();
  document.getElementById('cnt-total').textContent = cache.books.length;
  document.getElementById('cnt-avail').textContent = cache.books.filter(b => !rented.has(Number(b.id))).length;
  document.getElementById('cnt-out').textContent   = cache.books.filter(b =>  rented.has(Number(b.id))).length;
  document.getElementById('books-tbody').innerHTML = cache.books.length
    ? cache.books.map(b => {
        const out    = rented.has(Number(b.id));
        const rental = cache.rentals.find(r => String(r.bookId) === String(b.id) && String(r.returned) === 'false');
        return `<tr>
          <td style="font-weight:500">${b.title}</td>
          <td>${b.category}</td><td>${fmt(b.addedDate)}</td>
          <td>${out ? '<span class="badge b-amber">대여 중</span>' : '<span class="badge b-green">대여 가능</span>'}</td>
          <td>${rental ? `${rental.person}<div class="sub-text">${rental.team || ''}</div>` : '—'}</td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="5" class="empty-state">등록된 도서가 없습니다</td></tr>';
}

function renderRental() {
  const rented = getRentedIds();
  const avail  = cache.books.filter(b => !rented.has(Number(b.id)));
  document.getElementById('rent-book').innerHTML = avail.length
    ? avail.map(b => `<option value="${b.id}">${b.title}</option>`).join('')
    : '<option value="">대여 가능한 도서 없음</option>';

  const active = cache.rentals.filter(r => String(r.returned) === 'false');
  const done   = cache.rentals.filter(r => String(r.returned) === 'true');
  document.getElementById('rental-tbody').innerHTML = [...active, ...done].length
    ? [...active, ...done].map(r => {
        const isDone = String(r.returned) === 'true';
        const days   = isDone ? '—' : daysAgo(r.rentDate) + '일';
        const over   = !isDone && daysAgo(r.rentDate) > 60;
        const badge  = isDone ? '<span class="badge b-green">반납 완료</span>'
                     : over   ? '<span class="badge b-red">연체</span>'
                     : '<span class="badge b-amber">대여 중</span>';
        return `<tr class="${over ? 'overdue-row' : ''}">
          <td style="font-weight:500">${r.bookTitle}</td>
          <td>${r.person}</td><td>${r.team || '—'}</td>
          <td>${fmt(r.rentDate)}</td>
          <td style="${over ? 'color:var(--red-text);font-weight:600' : ''}">${days}</td>
          <td>${badge}</td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="6" class="empty-state">대여 내역이 없습니다</td></tr>';
}

function filterMyRentals() {
  const name = document.getElementById('return-person').value.trim();
  const mine = cache.rentals.filter(r => String(r.returned) === 'false' && r.person === name);
  document.getElementById('return-book').innerHTML = mine.length
    ? mine.map(r => `<option value="${r.id}">${r.bookTitle}</option>`).join('')
    : '<option value="">대여 중인 도서 없음</option>';
}

async function doRent() {
  const bookId = document.getElementById('rent-book').value;
  const person = document.getElementById('rent-person').value.trim();
  const team   = document.getElementById('rent-team').value;
  if (!bookId || !person) { if (!person) document.getElementById('rent-person').focus(); return; }
  const book = cache.books.find(b => String(b.id) === String(bookId));
  if (!book) return;
  const btn = document.getElementById('rent-btn');
  btn.disabled = true; btn.textContent = '처리 중...';
  try {
    const res = await apiPost({ action: 'addRental', data: { bookId, bookTitle: book.title, person, team: team || '미기재', rentDate: today() } });
    if (!res.ok) throw new Error(res.error || '오류');
    cache.rentals.push({ id: res.id, bookId, bookTitle: book.title, person, team: team || '미기재', rentDate: today(), returned: 'false', returnDate: '' });
    document.getElementById('rent-person').value = '';
    document.getElementById('rent-team').value   = '';
    document.getElementById('rent-ok-msg').textContent = `"${book.title}" 대여가 완료되었습니다.`;
    const ok = document.getElementById('rent-ok');
    ok.classList.add('show'); setTimeout(() => ok.classList.remove('show'), 3000);
    renderRental(); renderBooks();
  } catch (e) {
    document.getElementById('rent-err-msg').textContent = e.message;
    const el = document.getElementById('rent-err');
    el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 4000);
  } finally { btn.disabled = false; btn.textContent = '대여 신청'; }
}

async function doReturn() {
  const rentalId = document.getElementById('return-book').value;
  if (!rentalId) return;
  const r = cache.rentals.find(x => String(x.id) === String(rentalId));
  if (!r) return;
  const btn = document.getElementById('return-btn');
  btn.disabled = true; btn.textContent = '처리 중...';
  try {
    const res = await apiPost({ action: 'returnBook', data: { id: rentalId, returnDate: today() } });
    if (!res.ok) throw new Error(res.error || '오류');
    r.returned = 'true'; r.returnDate = today();
    document.getElementById('return-person').value = '';
    document.getElementById('return-book').innerHTML = '<option value="">이름을 먼저 입력하세요</option>';
    const ok = document.getElementById('return-ok');
    ok.classList.add('show'); setTimeout(() => ok.classList.remove('show'), 3000);
    renderRental(); renderBooks();
  } catch (e) {
    document.getElementById('return-err-msg').textContent = e.message;
    const el = document.getElementById('return-err');
    el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 4000);
  } finally { btn.disabled = false; btn.textContent = '반납 신청'; }
}

loadAll();
</script>
</body>
