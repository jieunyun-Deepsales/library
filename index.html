<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>딥세일즈 도서 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.09);
    --border-md: rgba(0,0,0,0.15);
    --text: #1a1a1a;
    --text-sub: #6b6b6b;
    --text-hint: #9e9e9e;
    --radius: 10px;
    --radius-sm: 6px;
    --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --amber-bg: #FAEEDA; --amber-text: #633806;
    --green-bg: #EAF3DE; --green-text: #27500A;
    --red-bg: #FCEBEB; --red-text: #791F1F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .logo span { color: var(--blue-text); }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; }
  .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 0; }
  .tab-btn { padding: 13px 18px; font-size: 14px; font-weight: 500; color: var(--text-sub); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .tab-btn svg { width: 16px; height: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 1.25rem; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.25rem; }
  .met { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-align: center; }
  .met-v { font-size: 28px; font-weight: 600; }
  .met-l { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-grid.full { grid-template-columns: 1fr; }
  .field label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 5px; font-weight: 500; }
  input[type=text], input[type=url], select { width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit; border: 1px solid var(--border-md); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  input:focus, select:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }
  .btn { padding: 9px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; border: 1px solid var(--border-md); background: var(--surface); color: var(--text); }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn.primary:hover { background: #333; }
  .btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .b-blue { background: var(--blue-bg); color: var(--blue-text); }
  .b-amber { background: var(--amber-bg); color: var(--amber-text); }
  .b-green { background: var(--green-bg); color: var(--green-text); }
  .b-red { background: var(--red-bg); color: var(--red-text); }
  .alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px; display: none; align-items: center; gap: 8px; }
  .alert.show { display: flex; }
  .alert.warn { background: var(--amber-bg); color: var(--amber-text); border: 1px solid #FAC775; }
  .alert.success { background: var(--green-bg); color: var(--green-text); border: 1px solid #C0DD97; }
  .alert.danger { background: var(--red-bg); color: var(--red-text); border: 1px solid #F09595; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; font-size: 11px; color: var(--text-sub); padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg); letter-spacing: 0.3px; text-transform: uppercase; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .overdue-row td { background: #fff8f8 !important; }
  .sub-text { font-size: 11px; color: var(--text-hint); margin-top: 1px; }
  .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
  .section-lbl { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }
  .empty-state { text-align: center; padding: 3rem; color: var(--text-hint); font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }

    main { padding: 1rem; }
    .form-grid { grid-template-columns: 1fr; }
    .metrics { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .met-v { font-size: 22px; }
    nav { overflow-x: auto; }
    .tab-btn { white-space: nowrap; padding: 13px 14px; font-size: 13px; }
